<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — PokéHub Fatec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/navbar.css">
<link rel="stylesheet" href="../assets/css/pages/pokedex.css">
</head>
<body>

  <header class="header" id="header">
    <nav class="nav container" aria-label="Principal">
      <a href="../index.html" class="logo">PokéHub <span>Fatec</span></a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>

      <div class="nav-menu" id="nav-menu">
        <ul class="nav-list">
          <li><a href="../index.html">Home</a></li>
          <li><a href="pokedex.html" class="nav-link active">Pokédex</a></li>
          <li><a href="tcg.html">TCG</a></li>
          <li><a href="eventos.html">Eventos</a></li>
          <li><a href="comunidade.html">Comunidade</a></li>
          <li><a href="ranking.html">Ranking</a></li>
        </ul>
        <a href="#login" class="btn btn-outline btn-sm">Login</a>
      </div>
    </nav>
  </header>

  <main class="pokedex-page">
    <div id="pokedex3d-container" class="pokedex3d-container">
      <canvas id="pokedex3d-canvas"></canvas>
      
      <div id="pokedex3d-overlay" class="pokedex3d-overlay">
        <div class="ds-pokedex-frame">
          <img src="../assets/images/pokedex.png" alt="Pokédex Frame" class="ds-bg-image">
          
          <button id="resetViewBtn" class="btn-reset-3d" title="Voltar para Pokédex 3D">↺ Visão 3D</button>
          
          <!-- Top Screen: Pokémon Display (Quadro à esquerda, infos empilhadas à direita) -->
          <div class="ds-top-screen">
            <div id="screen" class="ds-screen-content">
              <div class="placeholder" id="placeholder">
                <span class="big">◌</span>
                Digite o nome de um pokémon na tela inferior e pressione buscar
              </div>
            </div>
          </div>

          <!-- Bottom Screen: Campo de Busca e Controles -->
          <div class="ds-bottom-screen">
            <div class="ds-touch-controls">
              <div class="controls-label">BUSCADOR POKÉHUB</div>
              <div class="controls">
                <input type="text" id="pokeInput" placeholder="ex: lucario" autocomplete="off">
                <button id="searchBtn" aria-label="Buscar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#4a2f00" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="hint-3d" id="hint3d">
        <span>✦ Passe o mouse para inclinar • Clique para aproximar e buscar</span>
      </div>
    </div>
  </main>

  <script src="../assets/js/script.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
        "@splinetool/loader": "https://unpkg.com/@splinetool/loader@1.9.80/build/SplineLoader.js"
      }
    }
  </script>
  <script type="module" src="../assets/js/pokedex3d.js"></script>
  <script src="../assets/js/pokedex.js"></script>
</body>
</html>
